name: NORDA quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker development tools
        working-directory: worker
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Type-check Cloudflare Worker
        working-directory: worker
        run: npx tsc --noEmit -p tsconfig.json

      - name: Bundle Worker without deploying
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir=/tmp/norda-worker-build

      - name: Check frontend JavaScript syntax
        run: |
          node --check assets/main.js
          node --check assets/script.js
          node <<'NODE'
          const fs = require('node:fs');
          const pages = ['index.html', 'templates.html', 'digital.html', 'product.html', 'contact.html', 'faq.html'];
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            const scripts = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)];
            for (const [, attrs, body] of scripts) {
              if (/\bsrc\s*=/.test(attrs) || /application\/ld\+json/i.test(attrs)) continue;
              if (body.trim()) new Function(body);
            }
          }
          console.log('Inline page scripts parsed successfully.');
          NODE

      - name: Validate additive D1 migrations
        run: |
          python3 <<'PY'
          import glob, sqlite3
          db = sqlite3.connect(':memory:')
          db.executescript('''
            CREATE TABLE tickets (id INTEGER PRIMARY KEY, public_id TEXT, visitor_id TEXT);
            CREATE TABLE messages (id INTEGER PRIMARY KEY, ticket_id INTEGER, message_text TEXT);
            INSERT INTO tickets (id, public_id, visitor_id) VALUES (1, 'legacy-ticket', 'legacy-user');
            INSERT INTO messages (id, ticket_id, message_text) VALUES (1, 1, 'preserve this');
          ''')
          for path in sorted(glob.glob('worker/migrations/*.sql')):
            with open(path, encoding='utf-8') as source:
              db.executescript(source.read())
          assert db.execute("SELECT message_text FROM messages WHERE id=1").fetchone()[0] == 'preserve this'
          assert db.execute("SELECT visitor_id FROM tickets WHERE id=1").fetchone()[0] == 'legacy-user'
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'telegram_updates', 'visitor_auth_sessions', 'telegram_delivery_failures', 'contact_submissions', 'notification_outbox'} <= tables
          assert db.execute("SELECT handoff_status FROM tickets WHERE id=1").fetchone()[0] == 'none'
          print('Migrations are valid and existing ticket/message rows are preserved.')
          worker = open('worker/src/index.ts', encoding='utf-8').read()
          assert "support_mode = 'ai' AND handoff_status = 'none'" in worker, 'AI replies must be blocked once human handoff starts'
          assert 'const handoffPending = latest?.handoff_status === "pending"' in worker, 'API must expose pending handoff state'
          assert "SET claimed_at = ?, claim_token = ?" in worker, 'Outbox delivery must acquire an atomic lease'
          assert "claimed_at IS NULL OR claimed_at <= ?" in worker, 'Outbox claims must recover after an expired lease'
          assert "claim_token = ?" in worker, 'Outbox updates must be guarded by the active claim token'
          assert "AbortSignal.timeout(15000)" in worker, 'Telegram requests must have a bounded timeout'
          outbox_columns = {row[1] for row in db.execute("PRAGMA table_info(notification_outbox)")}
          assert {'claimed_at', 'claim_token'} <= outbox_columns, 'Outbox lease columns are missing'
          db.execute("""
            INSERT INTO notification_outbox
              (id, event_type, reference_id, dedupe_key, payload, status, attempts, created_at, next_attempt_at)
            VALUES ('claim-test', 'contact', 'contact-test', 'claim-test', 'payload', 'pending', 0, '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z')
          """)
          first_claim = db.execute("""
            UPDATE notification_outbox SET claimed_at='2026-01-01T00:00:01Z', claim_token='worker-a'
            WHERE id='claim-test' AND status='pending' AND next_attempt_at <= '2026-01-01T00:00:02Z'
              AND (claimed_at IS NULL OR claimed_at <= '2025-12-31T23:58:02Z')
          """)
          second_claim = db.execute("""
            UPDATE notification_outbox SET claimed_at='2026-01-01T00:00:02Z', claim_token='worker-b'
            WHERE id='claim-test' AND status='pending' AND next_attempt_at <= '2026-01-01T00:00:02Z'
              AND (claimed_at IS NULL OR claimed_at <= '2025-12-31T23:58:02Z')
          """)
          assert first_claim.rowcount == 1 and second_claim.rowcount == 0, 'Concurrent outbox claims must be exclusive'
          print('Human handoff race guard is present.')
          print('Telegram outbox lease and exclusive-claim checks passed.')
          PY
