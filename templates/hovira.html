      if (rec && th) d.dataset.theme = th[1];
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('hovira:theme') || '"dark"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          var a = JSON.parse(localStorage.getItem('hovira:appearance') || 'null');
          if (a && a.v === 1) {
            var hex = /^#[0-9a-f]{6}$/i;
            if (a.tint === 'cool' || a.tint === 'warm') d.setAttribute('data-tint', a.tint);

          }
        }
      } catch (e) {}
      if (d.dataset.theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#d9d4cc');
    })(document.documentElement);
