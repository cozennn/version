    /* Before first paint: the saved theme and the saved Appearance (its
       variables, cached per theme by appearance.ts), so a reload never
       flashes the wrong colours. Under ?record the page waits for the rig
       and ignores saved choices. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      var th = location.search.match(/[?&]theme=(dark|light)\b/);
      if (rec && th) d.dataset.theme = th[1];
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('curava:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          var a = JSON.parse(localStorage.getItem('curava:appearance:vars') || 'null');
          if (a) {
            var v = a[d.dataset.theme] || {};
            for (var k in v) d.style.setProperty(k, v[k]);
            d.dataset.surface = a.surface; d.dataset.density = a.density; d.dataset.motion = a.motion; d.dataset.font = a.font;
          }
        }
      } catch (e) {}
      if (d.dataset.theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#10131c');
    })(document.documentElement);
  </script>
