    /* Before first paint: the saved theme and the saved appearance (colours,
       text size, roundness…), so a reload never flashes the defaults. Under
       ?record the page waits for the rig and ignores every saved choice. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      var th = location.search.match(/[?&]theme=(dark|light)\b/);
      if (rec && th) d.dataset.theme = th[1];
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('radiva:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          var a = JSON.parse(localStorage.getItem('radiva:appearance') || 'null');
          if (a && a.v === 1 && a.css) {
            var vars = a.css[d.dataset.theme === 'dark' ? 'dark' : 'light'] || {};
            for (var k in vars) d.style.setProperty(k, vars[k]);
            if (a.surface) d.dataset.surface = a.surface;
            if (a.motion) d.dataset.motion = a.motion;
            if (a.font === 'oswald') d.dataset.headfont = 'oswald';
          }
        }
      } catch (e) {}
      if (d.dataset.theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1312');
    })(document.documentElement);
  </script>
