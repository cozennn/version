<body>
  <button id="sound-toggle" class="sound-toggle" type="button"
          aria-pressed="true" aria-label="Mute sound effects" title="Sound on">
    <span aria-hidden="true">🔊</span>
  </button>

  <!-- the door-icon markup (frame + swinging panel + stickman), reused by both buttons -->
  <template id="dooric-tpl">
    <span class="dooric" aria-hidden="true">
      <span class="dooric__frame"><span class="dooric__glow"></span></span>
      <span class="dooric__panel"><span class="dooric__handle"></span></span>
      <span class="dooric__person">
        <svg viewBox="0 0 26 44" width="17" height="29"
             fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
          <g class="person"><g class="person__bob">
            <!-- back leg + arm (behind the torso) -->
            <g class="leg leg--back">
              <line x1="13" y1="25" x2="13" y2="34"/>
              <g class="shin"><line x1="13" y1="34" x2="13" y2="42.5"/></g>
            </g>
            <g class="arm arm--back"><line x1="13" y1="14.5" x2="13" y2="24"/></g>
            <!-- head + torso -->
            <circle cx="13" cy="7" r="4" fill="currentColor" stroke="none"/>
            <line x1="13" y1="11" x2="13" y2="25.5"/>
            <!-- front leg + arm -->
            <g class="leg leg--front">
              <line x1="13" y1="25" x2="13" y2="34"/>
              <g class="shin"><line x1="13" y1="34" x2="13" y2="42.5"/></g>
            </g>
            <g class="arm arm--front"><line x1="13" y1="14.5" x2="13" y2="24"/></g>
          </g></g>
        </svg>
      </span>
    </span>
  </template>

  <main class="stage">
    <div class="card">
      <form class="login" id="login" novalidate autocomplete="on">
        <div class="login__body">
          <div class="login__head">
            <span class="login__badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M6 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 21h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                <circle cx="13.4" cy="12" r="1.15" fill="currentColor"/>
              </svg>
            </span>
            <h1 class="login__title">Sign in</h1>
            <p class="login__sub">Welcome back — step through to continue.</p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <div class="field__wrap">
              <svg class="field__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/>
                <path d="m4 7.5 8 5.5 8-5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input id="email" name="email" type="email" autocomplete="email"
                     placeholder="you@example.com" value="demo@door.app" required />
            </div>
          </div>

          <div class="field">
            <div class="field__row">
              <label for="password">Password</label>
              <button class="field__link" type="button">Forgot?</button>
            </div>
            <div class="field__wrap field__wrap--pw">
              <svg class="field__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
                <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
              <input id="password" name="password" type="password" autocomplete="current-password"
                     placeholder="••••••••" value="opensesame" required minlength="4" />
              <button class="field__toggle" id="pw-toggle" type="button" aria-label="Show password" aria-pressed="false">
                <svg class="i-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.7"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
                </svg>
                <svg class="i-eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                  <path d="M10.6 6.1A9.6 9.6 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-2.2 2.9M6.2 6.3A17 17 0 0 0 2 12s3.6 7 10 7a9.4 9.4 0 0 0 4.2-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

          <label class="remember">
            <input type="checkbox" id="remember" checked />
            <span class="remember__box" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 10 17 19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span>Keep me signed in</span>
          </label>

          <button class="doorbtn doorbtn--primary" id="submit" type="submit">
            <span class="doorbtn__label" id="submit-label">Sign in</span>
            <!-- .dooric injected here from the template -->
          </button>
          <p class="err" id="err" role="alert"></p>

          <div class="social">
            <span class="social__sep">or continue with</span>
            <div class="social__row">
              <button class="social__btn" type="button" aria-label="Continue with Google">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                  <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/>
                  <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/>
                  <path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1z"/>
                  <path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.7l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1C6.2 6.9 8.9 4.8 12 4.8z"/>
                </svg>
              </button>
              <button class="social__btn" type="button" aria-label="Continue with GitHub">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#1b1f24" aria-hidden="true">
                  <path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.9 10.9c.6.1.8-.2.8-.5v-1.8c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17 4.6 18 4.9 18 4.9c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5A11.5 11.5 0 0 0 12 .5z"/>
                </svg>
              </button>
              <button class="social__btn" type="button" aria-label="Continue with Apple">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#111" aria-hidden="true">
                  <path d="M16.4 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.9-1.4-.1-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.9-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.8zM14.2 5.9c.6-.8 1-1.9.9-3-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-.9 2.9 1 .1 2-.5 2.7-1.3z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </form>

      <!-- Shown once you're signed in -->
      <div class="account" id="account" hidden>
        <div class="account__row">
          <span class="account__avatar" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="24" height="24">
              <circle cx="24" cy="18" r="9" fill="currentColor"/>
              <path d="M8 42a16 16 0 0 1 32 0Z" fill="currentColor"/>
            </svg>
          </span>
          <span class="account__meta">
            <b>Welcome back</b>
            <small id="account-email">demo@door.app</small>
          </span>
        </div>
        <button class="doorbtn doorbtn--ghost" id="signout" type="button">
          <span class="doorbtn__label">Log Out</span>
          <!-- .dooric injected here from the template -->
        </button>
      </div>
    </div>
  </main>

  <p id="live" class="sr-only" aria-live="polite"></p>
  <div id="fx" class="fx" aria-hidden="true"></div>

  <script>
    /* password show / hide toggle */
    (function () {
      var t = document.getElementById('pw-toggle'), p = document.getElementById('password');
      if (!t || !p) return;
      t.addEventListener('click', function () {
        var showing = p.type === 'text';
        p.type = showing ? 'password' : 'text';
        t.setAttribute('aria-pressed', String(!showing));
        t.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });
    })();
  </script>
