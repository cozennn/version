<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="app">
    <header class="top">
      <a class="brand" href="#/dashboard" aria-label="Sunrow — overview">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 15.5h16M6.2 15.5 8 8.5h8l1.8 7"/><path d="M9.5 8.5 9 15.5M14.5 8.5l.5 7M7.1 12h9.8"/><path d="M12 2.8v2M5.7 5.2l1.2 1.2M18.3 5.2l-1.2 1.2"/><path d="M8 20h8"/></svg></span>
        <span class="brand__text">Sunrow<small>Field ERP</small></span>
      </a>
      <!-- Page groups. The ink pill is a clipped layer holding a cream copy of
           the labels: its two edges move on their own, so it stretches without
           ever scaling, and a label changes colour exactly at the pill's edge. -->
      <nav class="ptabs" aria-label="Main">
        <div class="ptabs__track" id="ptabs"><span class="ptabs__pill" aria-hidden="true"></span></div>
      </nav>
      <div class="top__tools">
        <span class="clock" id="clock" title="Site time (Mountain)"><i aria-hidden="true"></i><span id="clock-time"></span><small id="clock-note">Live</small></span>
        <button type="button" class="ibtn ibtn--glass" id="btn-bell" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="num-badge" id="bell-badge" hidden></span></button>
        <button type="button" class="org" id="btn-org" aria-haspopup="menu" aria-expanded="false"></button>
        <button type="button" class="top__me" id="btn-me" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </header>

    <!-- The pages inside the current group, on a glass row (hidden for a one-page group) -->
    <nav class="gtabs" id="gtabs" aria-label="Pages in this section" hidden>
      <div class="gtabs__track" id="gtabs-track"><span class="gtabs__pill" aria-hidden="true"></span></div>
    </nav>

    <main id="main" class="main">
      <section class="view" data-view="dashboard" hidden></section>
      <section class="view" data-view="projects" hidden></section>
      <section class="view" data-view="progress" hidden></section>
      <section class="view" data-view="contractors" hidden></section>
      <section class="view" data-view="materials" hidden></section>
      <section class="view" data-view="purchasing" hidden></section>
      <section class="view" data-view="budget" hidden></section>
      <section class="view" data-view="reports" hidden></section>
      <section class="view" data-view="documents" hidden></section>
      <section class="view" data-view="approvals" hidden></section>
      <section class="view" data-view="timesheet" hidden></section>
      <section class="view" data-view="safety" hidden></section>
      <section class="view" data-view="equipment" hidden></section>
      <section class="view" data-view="insights" hidden></section>
      <section class="view" data-view="settings" hidden></section>
      <section class="view" data-view="support" hidden></section>
    </main>
  </div>

  <!-- The dock: a dark pill on the left (a bottom bar on tablets and phones) -->
  <nav class="dock" aria-label="Tools">
    <button type="button" class="dock__btn" data-act="search" aria-label="Search (⌘K)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span class="dock__tip">Search <kbd>⌘K</kbd></span></button>
    <button type="button" class="dock__btn" data-act="new" id="btn-new" aria-label="Quick create" aria-haspopup="menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="dock__tip">Quick create <kbd>C</kbd></span></button>
    <span class="dock__sep" aria-hidden="true"></span>
    <a class="dock__btn" href="#/settings" data-route="settings" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l2 2.1 2.9-.4.7 2.8 2.6 1.4-1 2.8 1 2.8-2.6 1.4-.7 2.8-2.9-.4-2 2.1-2-2.1-2.9.4-.7-2.8-2.6-1.4 1-2.8-1-2.8 2.6-1.4.7-2.8 2.9.4Z"/></svg><span class="dock__tip">Settings</span></a>
    <a class="dock__btn" href="#/support" data-route="support" aria-label="Help and support"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/><path d="m6 6 3.5 3.5M14.5 14.5 18 18M18 6l-3.5 3.5M9.5 14.5 6 18"/></svg><span class="dock__tip">Help &amp; support</span></a>
    <span class="dock__sep" aria-hidden="true"></span>
    <button type="button" class="dock__btn dock__theme" data-act="theme" id="btn-theme" aria-label="Switch to dark theme"><svg class="ico ico--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></svg><svg class="ico ico--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span class="dock__tip">Theme</span></button>
  </nav>

  <!-- Sunrow AI: the assistant docks bottom-right on every page -->
  <aside class="assist" id="assist" aria-label="Sunrow AI assistant">
    <div class="assist__panel" id="assist-panel" role="dialog" aria-label="Sunrow AI assistant" hidden></div>
    <button type="button" class="assist__fab" id="assist-fab" aria-controls="assist-panel" aria-expanded="false">
      <span class="assist__fab-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5c.7 4.3 2.7 6.3 7 7-4.3.7-6.3 2.7-7 7-.7-4.3-2.7-6.3-7-7 4.3-.7 6.3-2.7 7-7Z"/><path d="M18.5 3v3M17 4.5h3"/></svg></span>
      <span class="assist__fab-text">Ask Sunrow AI</span>
      <span class="assist__fab-n" id="assist-n" hidden></span>
    </button>
  </aside>

  <!-- Signed out: a real sign-in screen that signs back in -->
  <div class="signin" id="signin" hidden></div>

  <div class="scrim" aria-hidden="true"></div>
  <div class="pop-layer" popover="manual"></div>

  <dialog class="finder" id="finder" aria-label="Search Sunrow">
    <div class="finder__bar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="finder-q" type="text" role="combobox" aria-expanded="true" aria-controls="finder-list" aria-autocomplete="list" placeholder="Project, site, contractor, PO, document, material…" autocomplete="off" spellcheck="false" />
      <kbd>esc</kbd>
    </div>
    <ul class="finder__list" id="finder-list" role="listbox" aria-label="Results"></ul>
  </dialog>
  <dialog class="modal" id="modal"></dialog>
  <dialog class="drawer" id="drawer"></dialog>

  <div class="toast" role="status" aria-live="polite" popover="manual">
    <span class="toast__ico"></span><span class="toast__msg"></span>
    <button type="button" class="toast__undo" hidden>Undo</button>
  </div>
