<body>
  <!-- The whole page is one room. `.is-on` = the lamp is lit; everything else
       (ambient warmth, the panda waking, the card rising) hangs off that one
       class, so there is exactly one source of truth for the state. -->
  <div class="room" id="room">

    <!-- ambient backdrop: the room itself, plus a warm pool anchored to the
         lamp head (its position is measured in JS into --lx/--ly). -->
    <div class="ambient" aria-hidden="true">
      <span class="orb orb--a"></span>
      <span class="orb orb--b"></span>
      <span class="motes"></span>
      <span class="grain"></span>
      <span class="roomlight"></span>
    </div>

    <!-- lamp and sign-in stand side by side on the same desk -->
    <div class="scene">

    <!-- ===================== THE DESK LAMP ===================== -->
    <!-- The lamp from projects/39-lamppull, re-coloured: it dozes with its eyes
         shut until you wake it, then perks its head up and grins.
         The switch is the cord, not a button — grab the brass bead, drag it
         anywhere, and RELEASE past the detent to click. The cord path is redrawn
         every frame (JS) and snaps back on an underdamped spring, so it rings
         like a real pull-chain. Only the bead takes pointer events; the rest of
         the SVG is transparent to whatever is behind it. -->
    <div class="lamp-stage">
      <div class="bob">
        <svg class="lamp" viewBox="0 0 360 384" role="img"
             aria-label="A desk lamp that sleeps until its cord is pulled">
          <defs>
            <linearGradient id="shadeOn" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0"   stop-color="#f8d6a8"/>
              <stop offset=".55" stop-color="#efb673"/>
              <stop offset="1"   stop-color="#e0904b"/>
            </linearGradient>
            <linearGradient id="shadeOff" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3b443e"/>
              <stop offset="1" stop-color="#242b27"/>
            </linearGradient>
            <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0"   stop-color="#8a6a3c"/>
              <stop offset=".38" stop-color="#f0d5a4"/>
              <stop offset=".62" stop-color="#d3ae75"/>
              <stop offset="1"   stop-color="#7d5f36"/>
            </linearGradient>
            <radialGradient id="base" cx="50%" cy="38%" r="70%">
              <stop offset="0" stop-color="#f2dcb4"/>
              <stop offset="1" stop-color="#9c7846"/>
            </radialGradient>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
              <stop offset="0"   stop-color="#ffeec6" stop-opacity=".92"/>
              <stop offset=".52" stop-color="#ffd897" stop-opacity=".6"/>
              <stop offset="1"   stop-color="#ffc471" stop-opacity="0"/>
            </radialGradient>
            <!-- the soft bloom the whole shade radiates. Painted, not a CSS blur
                 filter — same look, none of the per-frame cost. -->
            <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
              <stop offset="0"   stop-color="#ffcf8a" stop-opacity=".32"/>
              <stop offset=".45" stop-color="#ffbe6f" stop-opacity=".12"/>
              <stop offset="1"   stop-color="#ffb056" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe3ac" stop-opacity=".5"/>
              <stop offset="1" stop-color="#ffe3ac" stop-opacity="0"/>
            </linearGradient>
            <radialGradient id="pool" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#ffe4a4" stop-opacity=".46"/>
              <stop offset="1" stop-color="#ffe4a4" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="knob" cx="36%" cy="30%" r="76%">
              <stop offset="0"   stop-color="#fff5e2"/>
              <stop offset=".5"  stop-color="#e0bd8c"/>
              <stop offset="1"   stop-color="#9c7846"/>
            </radialGradient>
            <linearGradient id="ropeGrad" x1="0" y1="236" x2="0" y2="304" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ddcaa8"/>
              <stop offset="1" stop-color="#a8906b"/>
            </linearGradient>
            <radialGradient id="beaconGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#ffe7b4" stop-opacity=".95"/>
              <stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- light spilling down + the warm pool it lays on the desk (on only) -->
          <path    class="lamp_light cone" d="M120,236 L240,236 L302,372 L58,372 Z" fill="url(#cone)"/>
          <ellipse class="lamp_light pool" cx="180" cy="360" rx="128" ry="27" fill="url(#pool)"/>

          <!-- stand : brass pole + weighted base -->
          <g class="stand">
            <rect x="172.5" y="232" width="15" height="86" rx="7.5" fill="url(#brass)"/>
            <ellipse cx="180" cy="322" rx="47" ry="11.5" fill="url(#base)"/>
            <ellipse cx="180" cy="318" rx="30" ry="6" fill="#f4e2c2"/>
            <!-- the strip of pole that catches the light -->
            <rect class="lamp_light" x="173" y="234" width="6" height="82" rx="3" fill="#fff2ce"/>
          </g>

          <!-- the bloom + the hot ring under the rim (on only) -->
          <ellipse class="lamp_light bloom" cx="180" cy="186" rx="164" ry="140" fill="url(#bloom)"/>
          <ellipse class="lamp_light glow"  cx="180" cy="238" rx="82" ry="23" fill="url(#glow)"/>

          <!-- HEAD : shade + face. Nods up to wake, droops to sleep, pivoting at
               the neck. Namespaced away from the panda's own .head. -->
          <g class="lamp__head">
            <!-- shade body, two stacked states crossfade off↔on -->
            <path class="shade shade--off" d="M147,116 L213,116 Q221,116 223,124 L246,229 Q248,236 241,237 Q180,251 119,237 Q112,236 114,229 L137,124 Q139,116 147,116 Z" fill="url(#shadeOff)"/>
            <path class="shade shade--on"  d="M147,116 L213,116 Q221,116 223,124 L246,229 Q248,236 241,237 Q180,251 119,237 Q112,236 114,229 L137,124 Q139,116 147,116 Z" fill="url(#shadeOn)"/>
            <!-- ribbed ceramic texture -->
            <g class="ribs" fill="none" stroke="#000" stroke-opacity=".06" stroke-width="1.6">
              <path d="M158,117 L152,240"/><path d="M202,117 L208,240"/>
            </g>
            <!-- bright warm rim along the bottom lip, on only -->
            <path class="lamp_light rim" d="M119,236 Q180,250 241,236" fill="none" stroke="#fff3d2" stroke-width="3.5" stroke-linecap="round"/>

            <!-- face : sleeping -->
            <g class="face face--off">
              <g class="zzz">
                <path d="M214,150 h9 l-9,11 h9" fill="none" stroke="#8fb6a2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M231,135 h6.5 l-6.5,8 h6.5" fill="none" stroke="#8fb6a2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
              </g>
              <!-- peaceful closed eyes, light enough to read on the dark shade -->
              <path class="lamp_eyes" d="M150,195 Q160,203 170,195" fill="none" stroke="#c2cdc4" stroke-width="4.5" stroke-linecap="round"/>
              <path class="lamp_eyes" d="M190,195 Q200,203 210,195" fill="none" stroke="#c2cdc4" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M173,210 Q180,215 187,210" fill="none" stroke="#c2cdc4" stroke-width="3.4" stroke-linecap="round"/>
              <ellipse cx="150" cy="205" rx="6" ry="3.6" fill="#8ca394" opacity=".4"/>
              <ellipse cx="210" cy="205" rx="6" ry="3.6" fill="#8ca394" opacity=".4"/>
            </g>
            <!-- face : awake + happy -->
            <g class="face face--on">
              <path class="lamp_eyes" d="M150,200 Q160,190 170,200" fill="none" stroke="#4a3520" stroke-width="5" stroke-linecap="round"/>
              <path class="lamp_eyes" d="M190,200 Q200,190 210,200" fill="none" stroke="#4a3520" stroke-width="5" stroke-linecap="round"/>
              <path class="lamp_mouth" d="M169,207 Q180,210 191,207 Q189,223 180,224 Q171,223 169,207 Z" fill="#48331e"/>
              <ellipse class="lamp_tongue" cx="180" cy="220" rx="5.2" ry="4.4" fill="#e2603f"/>
              <ellipse cx="148" cy="210" rx="6.5" ry="4" fill="#d9584f" opacity=".42"/>
              <ellipse cx="212" cy="210" rx="6.5" ry="4" fill="#d9584f" opacity=".42"/>
            </g>
          </g>

          <!-- pull-cord : sits OUTSIDE .lamp__head so its local frame is the plain
               view-box (no head-nod rotation), which keeps the pointer mapping
               exact. Drawn last → on top of the shade. Anchored at the lip. -->
          <g class="pull" role="button" tabindex="0"
             aria-label="Pull the cord to switch the lamp on or off"
             aria-pressed="false" aria-controls="signin">
            <path class="rope"       data-ref="cordpath"  d="M210,236 Q210,268 210,300" fill="none" stroke="url(#ropeGrad)" stroke-width="3.2" stroke-linecap="round"/>
            <path class="rope-sheen" data-ref="cordsheen" d="M210,236 Q210,268 210,300" fill="none" stroke="#fff6e2" stroke-opacity=".3" stroke-width="1.05" stroke-linecap="round"/>
            <g class="rope-knob" data-ref="bead">
              <!-- r=30 view-box units, not 22: on the smallest phone the lamp is
                   ~200 CSS px wide, and 22 units scaled down put the grab target
                   at 21px across — under the 24px minimum. Nothing else in this
                   SVG takes pointer events, so an over-generous circle costs
                   nothing and it is invisible either way. -->
              <circle class="rope-hit" data-ref="hit" cx="210" cy="300" r="30" fill="#000" fill-opacity="0"/>
              <circle class="beacon" cx="210" cy="300" r="15" fill="url(#beaconGrad)"/>
              <rect class="ferrule" x="207.5" y="288.5" width="5" height="6" rx="2.2" fill="url(#brass)"/>
              <ellipse class="bead" data-ref="ball" cx="210" cy="300" rx="6.6" ry="7.7" fill="url(#knob)" stroke="#000" stroke-opacity=".14" stroke-width=".5"/>
              <ellipse class="bead-hi" cx="207.8" cy="296.8" rx="1.9" ry="2.5" fill="#fff" opacity=".6"/>
            </g>
          </g>
        </svg>
      </div>

      <p class="hint" aria-hidden="true">Pull the cord</p>
    </div>


    <main class="auth">
      <!-- ===================== THE PANDA ===================== -->
      <!-- A rigged SVG mascot. He dozes while the room is dark; the light wakes
           him. His eyes track the caret while you type your username, his paws
           slap up over them the instant the password field is focused, and they
           lower so he peeks when you reveal the password. Part classes are kept
           generic (.eye / .paw / .ear / .blush / .eye__ball) so the art can be
           swapped without touching app.js. -->
      <div class="mascot-stage" aria-hidden="true">
        <svg class="mascot" viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="furLight" cx="50%" cy="34%" r="76%">
              <stop offset="0%"   stop-color="#fffdf7" />
              <stop offset="100%" stop-color="#e8e1d2" />
            </radialGradient>
            <radialGradient id="furDark" cx="46%" cy="24%" r="86%">
              <stop offset="0%"   stop-color="#3a3f4a" />
              <stop offset="100%" stop-color="#1b1e26" />
            </radialGradient>
            <!-- a shade lighter than the eye patches, with a rim below, so the
                 covering paws still read as paws against the panda's own black -->
            <radialGradient id="pawGrad" cx="50%" cy="24%" r="84%">
              <stop offset="0%"   stop-color="#4e5563" />
              <stop offset="100%" stop-color="#242833" />
            </radialGradient>
            <radialGradient id="irisGrad" cx="42%" cy="32%" r="74%">
              <stop offset="0%"   stop-color="#6b5443" />
              <stop offset="46%"  stop-color="#3d2e24" />
              <stop offset="100%" stop-color="#1b1410" />
            </radialGradient>
            <radialGradient id="sheenGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- everything the light has to reach; the zzz stay outside so they
               still read while the room is dark -->
          <g class="mascot__art">
            <ellipse class="mascot__shadow" cx="160" cy="276" rx="82" ry="14" />

            <!-- body : black shoulders + a cream belly, so the parked paws read as arms -->
            <ellipse class="body" cx="160" cy="262" rx="64" ry="46" fill="url(#furDark)" />
            <path class="bib" d="M160 228 C184 240 192 266 179 294 C160 300 160 300 141 294 C128 266 136 240 160 228 Z" fill="url(#furLight)" />

            <!-- ears : the panda's round black buttons -->
            <g class="ears">
              <g class="ear ear--l">
                <circle cx="95" cy="74" r="35" fill="url(#furDark)" />
                <circle cx="97" cy="78" r="20" fill="#2d323d" />
              </g>
              <g class="ear ear--r">
                <circle cx="225" cy="74" r="35" fill="url(#furDark)" />
                <circle cx="223" cy="78" r="20" fill="#2d323d" />
              </g>
            </g>

            <!-- head -->
            <g class="head">
              <ellipse class="head__base" cx="160" cy="150" rx="101" ry="89" fill="url(#furLight)" />
              <ellipse class="head__sheen" cx="126" cy="104" rx="56" ry="28" fill="url(#sheenGrad)" />

              <!-- the eye patches : the panda's whole signature, tilted inward -->
              <ellipse class="patch patch--l" cx="121" cy="139" rx="28" ry="33" fill="url(#furDark)" transform="rotate(-19 121 139)" />
              <ellipse class="patch patch--r" cx="199" cy="139" rx="28" ry="33" fill="url(#furDark)" transform="rotate(19 199 139)" />

              <!-- blush, out on the cream cheeks where it can be seen -->
              <ellipse class="blush blush--l" cx="80"  cy="180" rx="16" ry="9" fill="#ef9f86" />
              <ellipse class="blush blush--r" cx="240" cy="180" rx="16" ry="9" fill="#ef9f86" />

              <!-- muzzle mound -->
              <ellipse class="muzzle__shadow" cx="160" cy="196" rx="41" ry="29" fill="#ddd5c4" opacity="0.65" />
              <ellipse class="muzzle" cx="160" cy="191" rx="38" ry="27" fill="url(#furLight)" />

              <!-- eyes : glossy, set inside the patches -->
              <!-- The white is deliberately roomier than the iris: the gap
                   (rx 16.5 − r 10.2 = 6.3, ry 17.5 − r 10.2 = 7.3) IS the eye's
                   travel budget, and app.js reads exactly those numbers, so the
                   iris can never slide out from under its own white. -->
              <g class="eye eye--l">
                <ellipse class="eye__white" cx="123" cy="138" rx="16.5" ry="17.5" fill="#fbf8f1" />
                <g class="eye__ball">
                  <circle class="iris"  cx="123" cy="139" r="10.2" fill="url(#irisGrad)" />
                  <circle class="pupil" cx="123" cy="140" r="5.6"  fill="#12100e" />
                  <circle class="glint" cx="127" cy="134.5" r="3.7" fill="#fff" />
                  <circle class="glint glint--sm" cx="118.8" cy="143.5" r="1.8" fill="#fff" opacity="0.85" />
                </g>
              </g>
              <g class="eye eye--r">
                <ellipse class="eye__white" cx="197" cy="138" rx="16.5" ry="17.5" fill="#fbf8f1" />
                <g class="eye__ball">
                  <circle class="iris"  cx="197" cy="139" r="10.2" fill="url(#irisGrad)" />
                  <circle class="pupil" cx="197" cy="140" r="5.6"  fill="#12100e" />
                  <circle class="glint" cx="201" cy="134.5" r="3.7" fill="#fff" />
                  <circle class="glint glint--sm" cx="192.8" cy="143.5" r="1.8" fill="#fff" opacity="0.85" />
                </g>
              </g>
              <!-- the sleeping lids, drawn light so they read on the black patches -->
              <path class="eye__sleep" d="M109,136 Q123,150 137,136" fill="none" stroke="#ded6c6" stroke-width="4.2" stroke-linecap="round" />
              <path class="eye__sleep" d="M183,136 Q197,150 211,136" fill="none" stroke="#ded6c6" stroke-width="4.2" stroke-linecap="round" />

              <!-- nose, smile, hidden happy tongue -->
              <path class="nose" d="M160 172 C176 172 182 184 173 191 C168 195 152 195 147 191 C138 184 144 172 160 172 Z" fill="#1a1d24" />
              <path class="tongue" d="M149 205 Q160 226 171 205 Q160 212 149 205 Z" fill="#ef8fa1" />
              <path class="mouth" d="M160 192 L160 204 M160 204 Q147 213 137 207 M160 204 Q173 213 183 207" />

              <!-- whisker specks -->
              <g class="whiskers" fill="#9c9484" opacity="0.5">
                <circle cx="126" cy="196" r="1.3" /><circle cx="122" cy="203" r="1.3" /><circle cx="127" cy="209" r="1.3" />
