<body>

<div data-ref="root" data-screen-label="Login" class="lp-root">

  <div class="lp-vignette"></div>
  <div data-ref="wash" class="lp-wash"></div>
  <div data-ref="floor" class="lp-floor"></div>

  <div data-ref="glow" class="lp-glow"></div>

  <div data-ref="motes" class="lp-motes"></div>

  <!-- ceiling mount -->
  <div class="lp-mount"></div>

  <div data-ref="sway" class="lp-sway">
    <div data-ref="tilt" class="lp-tilt">

      <!-- cord from ceiling to socket -->
      <div class="lp-flex"></div>
      <div class="lp-socket"></div>

      <!-- glass bulb with face -->
      <div data-ref="glass" class="lp-glass">
        <div class="lp-highlight"></div>
        <div data-ref="eyeL" class="lp-eye lp-eye--l">
          <div data-ref="pupilL" class="lp-pupil"></div>
        </div>
        <div data-ref="eyeR" class="lp-eye lp-eye--r">
          <div data-ref="pupilR" class="lp-pupil"></div>
        </div>
        <div data-ref="cheekL" class="lp-cheek lp-cheek--l"></div>
        <div data-ref="cheekR" class="lp-cheek lp-cheek--r"></div>
        <div data-ref="mouth" class="lp-mouth"></div>
      </div>

      <div data-ref="zzz" class="lp-zzz">z<span>z</span></div>

      <!-- pull cord: an SVG cord that hangs FROM the bulb base, follows the
           pointer while dragged, and springs back elastically on release
           (impossible-lightbulb style). Anchored at (80,0) = bulb base centre. -->
      <svg data-ref="cordsvg" class="lp-cord" viewBox="0 0 160 200" width="160" height="200" aria-hidden="true">
        <defs>
          <radialGradient id="lp-beadgrad" cx="38%" cy="33%" r="72%">
            <stop offset="0%" stop-color="#ead7ae"/>
            <stop offset="60%" stop-color="#bfa371"/>
            <stop offset="100%" stop-color="#8d7647"/>
          </radialGradient>
        </defs>
        <circle class="lp-cord__mount" cx="80" cy="0" r="3.2"/>
        <path data-ref="cordpath" class="lp-cord__line" d="M80 0 Q80 38 80 76"/>
        <g data-ref="bead" class="lp-bead" role="button" tabindex="0" aria-label="Pull the cord to switch the light on or off" aria-pressed="false">
          <circle data-ref="hit" class="lp-cord__hit" cx="80" cy="76" r="21"/>
          <circle data-ref="ball" class="lp-cord__bead" cx="80" cy="76" r="8"/>
          <circle class="lp-cord__beadhi" cx="77.4" cy="73" r="2.3"/>
        </g>
      </svg>
      <div data-ref="hint" class="lp-hint"><div class="lp-hint__arrow">&#8595;</div><div class="lp-hint__txt">pull</div></div>

    </div>
  </div>

  <!-- login form, revealed when the light comes on -->
  <div data-ref="formWrap" class="lp-formwrap">
    <div class="lp-card">
      <div data-stagger class="lp-brand">
        <div class="lp-brand__dot"></div>
        <span class="lp-brand__name">Lumen</span>
      </div>
      <p data-stagger class="lp-sub">Welcome back &mdash; the light&rsquo;s on for you.</p>
      <form data-ref="form">
        <div data-stagger class="lp-field">
          <input type="email" placeholder=" " class="lp-input" />
          <label class="lp-label">Email</label>
          <div data-ul class="lp-underline"></div>
        </div>
        <div data-stagger class="lp-field">
          <input data-ref="pwInput" type="password" placeholder=" " class="lp-input lp-input--pw" />
          <label class="lp-label">Password</label>
          <button data-ref="pwToggle" type="button" class="lp-pwtoggle">Show</button>
          <div data-ul class="lp-underline"></div>
        </div>
        <div data-stagger class="lp-row">
          <label class="lp-remember"><input type="checkbox" /> Remember me</label>
          <a href="#" class="lp-forgot">Forgot?</a>
        </div>
        <button data-ref="btn" type="submit" data-stagger class="lp-btn">
          <span data-ref="btnLabel" class="lp-btn__label">Sign in</span>
        </button>
      </form>
      <div data-stagger class="lp-divider">
        <div class="lp-divider__line"></div>
        <span class="lp-divider__txt">new here?</span>
        <div class="lp-divider__line"></div>
      </div>
      <a href="#" data-stagger class="lp-create">Create an account</a>
    </div>
  </div>

  <button data-ref="muteBtn" class="lp-mute">sound on</button>

</div>
