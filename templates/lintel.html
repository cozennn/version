  <a class="skip" href="#main">Skip to content</a>
  <div class="mesh" aria-hidden="true"><i class="mesh__a"></i><i class="mesh__b"></i><i class="mesh__c"></i></div>

  <div class="app">
    <div class="work">
      <header class="top">
        <a class="brand" href="#/overview" aria-label="Lintel — overview">
          <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 20.5V9.5L12 3.5l8.5 6v11"/><path d="M3.5 9.5h17M9 20.5v-6h6v6"/></svg></span>
          <span class="brand__text">Lintel</span>
        </a>
        <nav class="tabs" aria-label="Main">
          <div class="tabs__track">
            <a class="tab" href="#/overview" data-route="overview">Overview</a>
            <a class="tab" href="#/rentals" data-route="rentals">Rentals</a>
            <a class="tab" href="#/sales" data-route="sales">Sales</a>
            <a class="tab" href="#/deals" data-route="deals">Deals</a>
            <a class="tab" href="#/leads" data-route="leads">Leads<b class="tab__n" data-count-leads hidden></b></a>
            <a class="tab" href="#/contacts" data-route="contacts">Contacts</a>
            <!-- The ink pill is a clipped layer holding a light copy of the labels:
                 its two edges move on their own, so it stretches without ever
                 scaling, and the label colour changes exactly at its edge. -->
            <span class="tabs__pill" aria-hidden="true"></span>
          </div>
        </nav>
        <div class="top__tools">
          <button type="button" class="ibtn ibtn--glass magnetic" data-act="search" aria-label="Search (⌘K)" title="Search  ⌘K"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
          <button type="button" class="ibtn ibtn--glass magnetic top__chat" data-act="chat" aria-label="Open live chat" title="Live chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 18.5v-11a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-7.5z"/><path d="M8.5 9.5h7M8.5 12.5h4"/></svg><span class="num-badge" data-chat-badge hidden></span></button>
          <button type="button" class="ibtn ibtn--glass magnetic" data-act="bell" id="btn-bell" aria-label="Notifications" title="Notifications" aria-haspopup="dialog" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="dot-badge" id="bell-badge" hidden></span></button>
          <button type="button" class="ibtn ibtn--glass magnetic theme-btn" data-act="theme" aria-label="Switch to dark theme" title="Theme"><svg class="ico ico--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></svg><svg class="ico ico--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
          <button type="button" class="me magnetic" id="btn-me" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false"><img src="https://demo.codeandchill.store/lintel/photos/175-lintel/imani-brooks-sm.jpg" width="38" height="38" alt="" /></button>
        </div>
      </header>

      <main id="main" class="main">
        <section class="view" data-view="overview" hidden></section>
        <section class="view" data-view="rentals" hidden></section>
        <section class="view" data-view="sales" hidden></section>
        <section class="view" data-view="deals" hidden></section>
        <section class="view" data-view="leads" hidden></section>
        <section class="view" data-view="contacts" hidden></section>
        <section class="view" data-view="property" hidden></section>
      </main>
    </div>

    <aside class="chat" id="chat" aria-label="Live chat"></aside>
  </div>

  <div class="scrim" aria-hidden="true"></div>
  <div class="pop-layer"></div>

  <dialog class="finder" id="finder" aria-label="Search Lintel">
    <div class="finder__bar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="finder-q" type="text" role="combobox" aria-expanded="true" aria-controls="finder-list" aria-autocomplete="list" placeholder="Search properties, people, pages…" autocomplete="off" spellcheck="false" />
      <kbd>esc</kbd>
    </div>
    <ul class="finder__list" id="finder-list" role="listbox" aria-label="Results"></ul>
  </dialog>
  <dialog class="modal" id="modal"></dialog>
  <dialog class="drawer" id="drawer"></dialog>
  <dialog class="lightbox" id="lightbox" aria-label="Photos"></dialog>

  <div class="toast" role="status" aria-live="polite">
    <span class="toast__ico"></span><span class="toast__msg"></span>
    <button type="button" class="toast__undo" hidden>Undo</button>
  </div>
