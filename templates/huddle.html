<!--
  HUDDLE — a sign-in that is being watched.

  Four flat shapes stand in the illustration panel like a group photo, and they
  have opinions about what you are typing. They follow the cursor. They crane
  over towards the form while you fill in your email. The moment you touch the
  password field they get polite and look away — all except the black one, who
  can't help himself and sneaks a look until he's caught. Reveal the password
  with the eye toggle and the whole group turns its back: the tall one folds
  over at the waist, the yellow one flips to face the wall, the black one turns
  right around so he has no face at all.

  Everything the huddle does is a real state of a real form. There is no
  decoration here that isn't reporting something true: whether the field you are
  in is secret, whether the secret is on screen, whether caps lock is on,
  whether the credentials were refused. The form works with JavaScript off and
  lands every state with animation off.

  Zero dependencies. Transform and opacity only.
-->

<body>
  <div class="room" aria-hidden="true"></div>

  <main class="stage">
    <header class="masthead">
      <p class="masthead__eyebrow">Component · 88 · sign-in</p>
      <h1 class="masthead__title">Huddle</h1>
    </header>

    <!--
      One data-mood on .auth is the single source of truth for the whole cast:
        idle → nosy (email) → shy (password) → exposed (password revealed)
        and the two outcomes, wrong / win. app.js derives it; CSS draws it.
    -->
    <section class="auth" data-mood="idle" data-auth>

      <!-- ————————————————————————————————————————————————————————————
           LEFT · the huddle.
           Decorative: everything it says is also said by the toggle's
           aria-pressed, the caps-lock note and the live region below.
      ————————————————————————————————————————————————————————————— -->
      <div class="auth__art">
        <div class="huddle" data-huddle aria-hidden="true">

          <!-- TALL · violet. The nosiest. Bends at the waist, which is why the
               body is two pieces: a torso and a head that rotates about a point
               buried inside the torso, so the silhouette creases and never gaps. -->
          <div class="mate mate--tall" data-mate="tall">
            <div class="mate__breath">
              <svg viewBox="0 0 134 270" focusable="false">
                <rect class="ink-violet" x="0" y="118" width="134" height="152" />
                <g class="tall__head">
                  <path class="ink-violet" d="M0 150 V16 Q0 4 12 4 H122 Q134 4 134 16 V150 Z" />
                  <rect class="tall__lit" x="0" y="4" width="134" height="9" rx="4.5" />

                  <g class="face">
                    <g class="face__eyes is-open">
                      <g class="face__pupils">
                        <rect class="face__ink" x="40" y="50" width="8" height="14" rx="4" />
                        <rect class="face__ink" x="86" y="50" width="8" height="14" rx="4" />
                      </g>
                    </g>
                    <g class="face__eyes is-shut">
                      <path class="face__line" d="M36 60 Q44 51 52 60" />
                      <path class="face__line" d="M82 60 Q90 51 98 60" />
                    </g>
                    <g class="face__eyes is-glad">
                      <path class="face__line" d="M36 60 Q44 48 52 60" />
                      <path class="face__line" d="M82 60 Q90 48 98 60" />
                    </g>
                    <g class="face__mouth is-calm">
                      <rect class="face__ink" x="63" y="80" width="8" height="12" rx="4" />
                    </g>
                    <g class="face__mouth is-o">
                      <ellipse class="face__ink" cx="67" cy="88" rx="7" ry="10" />
                    </g>
                    <g class="face__mouth is-frown">
                      <path class="face__line" d="M53 94 Q67 82 81 94" />
                    </g>
                    <g class="face__mouth is-grin">
                      <path class="face__ink" d="M49 84 Q67 108 85 84 Z" />
                    </g>
                  </g>
                </g>
              </svg>
            </div>
          </div>

          <!-- INK · black. The one who peeks. Turned around he has no face at
               all, which is the whole joke of the revealed-password state. -->
          <div class="mate mate--ink" data-mate="ink">
            <div class="mate__breath">
              <svg viewBox="0 0 92 196" focusable="false">
                <path class="ink-black" d="M0 196 V18 Q0 2 16 2 H76 Q92 2 92 18 V196 Z" />
                <g class="face">
                  <g class="face__eyes is-open">
                    <circle class="ink-white" cx="29" cy="58" r="12.5" />
                    <circle class="ink-white" cx="63" cy="58" r="12.5" />
                    <g class="face__pupils">
                      <circle class="ink-black" cx="29" cy="58" r="6" />
                      <circle class="ink-black" cx="63" cy="58" r="6" />
                    </g>
                  </g>
                  <g class="face__eyes is-shut">
                    <path class="face__line face__line--light" d="M18 56 Q29 66 40 56" />
                    <path class="face__line face__line--light" d="M52 56 Q63 66 74 56" />
                  </g>
                  <!-- the sneak. One eye open a slit, pupil already swivelled
                       towards the form he is not supposed to be reading. -->
                  <g class="face__eyes is-peek">
                    <path class="face__line face__line--light" d="M18 56 Q29 66 40 56" />
                    <ellipse class="ink-white" cx="63" cy="57" rx="12.5" ry="7" />
                    <circle class="ink-black" cx="67" cy="58" r="5" />
                  </g>
                </g>
              </svg>
            </div>
          </div>

          <!-- SUN · yellow. Drawn in profile, so turning away is one scaleX.
               Its mouth runs past the edge of the shape on purpose. -->
          <div class="mate mate--sun" data-mate="sun">
            <div class="mate__breath">
              <svg viewBox="0 0 112 152" focusable="false">
                <path class="ink-yellow" d="M0 152 V56 A56 56 0 0 1 112 56 V152 Z" />
                <g class="sun__face face">
                  <g class="face__eyes is-open">
                    <g class="face__pupils">
                      <circle class="face__ink" cx="80" cy="50" r="5.5" />
                    </g>
                  </g>
                  <g class="face__eyes is-shut">
                    <path class="face__line" d="M72 50 Q80 42 88 50" />
                  </g>
                  <g class="face__mouth is-calm">
                    <path class="face__line face__line--lip" d="M62 88 H122" />
                  </g>
                  <g class="face__mouth is-wave">
                    <path class="face__line face__line--lip" d="M62 88 q9 -8 18 0 t18 0 t18 0" />
                  </g>
                  <g class="face__mouth is-grin">
                    <path class="face__line face__line--lip" d="M62 92 q20 -14 40 -22" />
                  </g>
                </g>
              </svg>
            </div>
          </div>

          <!-- BLUSH · orange. Front and centre, the one the group hides behind. -->
          <div class="mate mate--blush" data-mate="blush">
            <div class="mate__breath">
              <svg viewBox="0 0 264 134" focusable="false">
                <path class="ink-orange" d="M0 134 A132 132 0 0 1 264 134 Z" />
                <g class="face">
                  <g class="face__eyes is-open">
                    <g class="face__pupils">
                      <circle class="face__ink" cx="100" cy="74" r="8" />
                      <circle class="face__ink" cx="164" cy="74" r="8" />
                    </g>
                  </g>
                  <g class="face__eyes is-shut">
                    <path class="face__line" d="M88 78 Q100 64 112 78" />
                    <path class="face__line" d="M152 78 Q164 64 176 78" />
                  </g>
                  <g class="face__mouth is-calm">
                    <path class="face__ink" d="M110 92 Q132 116 154 92 Z" />
                  </g>
                  <g class="face__mouth is-dots">
                    <circle class="face__ink" cx="108" cy="104" r="4.5" />
                    <circle class="face__ink" cx="132" cy="104" r="4.5" />
                    <circle class="face__ink" cx="156" cy="104" r="4.5" />
                  </g>
                  <g class="face__mouth is-frown">
                    <path class="face__line" d="M110 108 Q132 88 154 108" />
                  </g>
                  <g class="face__mouth is-grin">
                    <path class="face__ink" d="M98 86 Q132 128 166 86 Z" />
                  </g>
                </g>
              </svg>
            </div>
          </div>

        </div>

        <!-- filled on the way to signed-in, emptied on reset, so an idle page
             carries no throwaway nodes -->
        <div class="confetti" data-confetti aria-hidden="true"></div>
      </div>

      <!-- ————————————————————————————————————————————————————————————
           RIGHT · the form. A plain, complete sign-in.
      ————————————————————————————————————————————————————————————— -->
      <div class="auth__panel">
        <div class="panel__inner" data-shake>
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 1c.9 6 4.1 9.2 10 10-5.9.8-9.1 4-10 10-.9-6-4.1-9.2-10-10 5.9-.8 9.1-4 10-10Z" />
          </svg>

          <h2 class="panel__title">Welcome back</h2>
          <p class="panel__sub">Please enter your details.</p>

          <form class="form" data-form novalidate>
            <div class="field" data-field="email">
              <label class="field__label" for="email">Email</label>
              <input class="field__input" id="email" name="email" type="email"
                     autocomplete="email" spellcheck="false" enterkeyhint="next"
                     placeholder="you@example.com" aria-describedby="err-email" />
              <span class="field__rule" aria-hidden="true"></span>
              <p class="field__err" id="err-email" data-err="email">
                <svg class="field__err-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <circle cx="8" cy="8" r="6.6" /><path d="M8 4.9v3.6" /><circle cx="8" cy="11.1" r=".95" />
                </svg>
                <span data-err-text="email"></span>
              </p>
            </div>

            <div class="field" data-field="password">
              <label class="field__label" for="password">Password</label>
              <input class="field__input field__input--pw" id="password" name="password" type="password"
                     autocomplete="current-password" enterkeyhint="go"
                     placeholder="••••••••" aria-describedby="err-password caps" />
              <button class="peek" type="button" data-peek aria-pressed="false" aria-controls="password">
                <span class="sr-only" data-peek-label>Show password</span>
                <svg class="peek__icon peek__icon--on" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2.6 12S6.4 5.8 12 5.8 21.4 12 21.4 12 17.6 18.2 12 18.2 2.6 12 2.6 12Z" />
                  <circle cx="12" cy="12" r="3.1" />
                </svg>
                <svg class="peek__icon peek__icon--off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2.6 12S6.4 5.8 12 5.8c1.4 0 2.7.4 3.8 1M21.4 12s-3.8 6.2-9.4 6.2c-1.5 0-2.8-.4-4-1.1" />
                  <path d="M9.9 9.9a3.1 3.1 0 0 0 4.3 4.3" />
                  <path d="M4 4l16 16" />
                </svg>
              </button>
              <span class="field__rule" aria-hidden="true"></span>
              <p class="field__err" id="err-password" data-err="password">
                <svg class="field__err-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <circle cx="8" cy="8" r="6.6" /><path d="M8 4.9v3.6" /><circle cx="8" cy="11.1" r=".95" />
                </svg>
                <span data-err-text="password"></span>
              </p>
              <p class="caps" id="caps" data-caps hidden>Caps lock is on.</p>
            </div>

            <div class="row" data-fade>
              <label class="check">
                <input type="checkbox" name="remember" checked />
                <span class="check__box" aria-hidden="true">
                  <svg viewBox="0 0 16 16" focusable="false"><path d="M3.5 8.4 6.6 11.5 12.5 5" pathLength="1" /></svg>
                </span>
                <span class="check__text">Remember for 30 days</span>
              </label>
              <a class="link" href="#forgot" data-forgot>Forgot password?</a>
            </div>

            <!-- The button and the signed-in block share one grid cell, so the
                 swap is a cross-fade in place and the card never changes height. -->
            <div class="actions">
              <button class="cta" type="submit" data-cta>
                <span class="cta__label">Log in</span>
                <span class="cta__spin" aria-hidden="true"></span>
                <svg class="cta__check" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M5.5 12.6 10 17l8.5-9.5" pathLength="1" />
                </svg>
              </button>

              <div class="done" data-done inert>
                <p class="done__who">Signed in as <b data-who>hasib@gmail.com</b></p>
                <button class="reset" type="button" data-reset>Sign out</button>
              </div>
            </div>
          </form>

          <div class="sep" data-fade><span>or</span></div>

          <button class="ghost" type="button" data-google data-fade>
            <svg class="ghost__g" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4Z"/>
              <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1a5.9 5.9 0 0 1-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/>
              <path fill="#FBBC05" d="M6.4 14a5.9 5.9 0 0 1 0-3.8V7.6H3.1a10 10 0 0 0 0 8.9L6.4 14Z"/>
              <path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.6l3.3 2.6A5.9 5.9 0 0 1 12 5.9Z"/>
            </svg>
            Log in with Google
          </button>

          <p class="panel__foot" data-fade>Don't have an account? <a class="link link--strong" href="#signup">Sign up</a></p>
        </div>
      </div>
    </section>

    <!-- One line, because this is the caption the reel reads too: three lines of
         small grey text are texture at that size, one short line is a title. -->
    <p class="hint">
      <span class="hint__say">Type your password. Watch them look away.</span>
      <span class="hint__creds">
        <span class="hint__b">hasib@gmail.com</span> · <span class="hint__b">hasib123</span>
      </span>
    </p>
  </main>

  <p class="sr-only" role="status" aria-live="polite" data-live></p>

  <script type="module" src="https://demo.codeandchill.store/huddle/app.js"></script>
