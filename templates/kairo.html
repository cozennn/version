  <div class="app">
    <aside class="side" id="side" aria-label="Sidebar">
      <div class="side__brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#22b8d6"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M11 8v16M11 17l9-9M14.5 14l6 10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <button class="ws__btn" id="ws-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="ws-menu">

        <div class="ws__menu" id="ws-menu" role="menu" aria-label="Workspaces" hidden></div>
      </div>

      <button class="side__search" data-palette>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg>

        <span class="side__hover" aria-hidden="true"></span>
        <span class="side__pill" aria-hidden="true"></span>
      </nav>

      <div class="side__foot">
        <div class="sync">
          <span class="sync__dot" aria-hidden="true"></span>
          <p class="sync__txt"><b>Synced with Stripe</b><small id="sync-at">2 min ago</small></p>
          <button class="sync__btn icon-btn" id="sync" aria-label="Sync now"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></svg></button>
        </div>

          <small id="plan-note">of $150k on the Growth plan</small>

        <div class="me">
          <span class="me__av" aria-hidden="true">AR</span>

        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="top__right">
          <span class="live" title="Data updates as Stripe events arrive"><i aria-hidden="true"></i>Live</span>
          <button class="icon-btn top__search" data-palette aria-label="Search metrics"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg></button>
          <button class="icon-btn" id="theme" aria-label="Switch to dark theme"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path id="theme-icon" d=""/></svg></button>

        <div class="page" data-page="benchmarks" hidden></div>
        <div class="page" data-page="tasks" hidden></div>
