<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="mesh" aria-hidden="true"><i class="mesh__a"></i><i class="mesh__b"></i><i class="mesh__c"></i></div>

  <div class="app">
    <header class="top">
      <a class="brand" href="#/overview" aria-label="Folka — overview">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.2c2.6 2.4 4 5.3 4 8.8s-1.4 6.4-4 8.8c-2.6-2.4-4-5.3-4-8.8s1.4-6.4 4-8.8Z"/><path d="M12 3.6v16.8"/><path d="M8.6 9.2 12 11l3.4-1.8M8.4 13.8 12 15.6l3.6-1.8"/></svg></span>
        <span class="brand__name">folka</span>
      </a>
      <nav class="ptabs" aria-label="Main">
        <div class="ptabs__track">
          <a class="ptab" href="#/overview" data-route="overview">Overview</a>
          <a class="ptab" href="#/people" data-route="people">People</a>
          <a class="ptab" href="#/time" data-route="time">Rota &amp; time</a>
          <a class="ptab" href="#/leave" data-route="leave">Time off</a>
          <a class="ptab" href="#/payroll" data-route="payroll">Payroll</a>
          <a class="ptab" href="#/hiring" data-route="hiring">Hiring</a>
          <a class="ptab" href="#/performance" data-route="performance">Growth</a>
          <a class="ptab" href="#/reports" data-route="reports">Reports</a>
          <!-- The ink pill is a clipped layer holding a cream copy of the labels:
               its edges move on their own, so it stretches without ever
               scaling, and the label colour changes exactly at its edge. -->
          <span class="ptabs__pill" aria-hidden="true"></span>
        </div>
      </nav>
      <div class="top__tools">
        <button type="button" class="ibtn ibtn--glass magnetic" id="btn-bell" aria-label="Notifications" title="Notifications" aria-haspopup="dialog" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="dot-badge" id="bell-badge" hidden></span></button>
        <button type="button" class="me magnetic" id="btn-me" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </header>

    <!-- what is happening now, one line at a time; pauses on hover, focus or
         the pause button (moving content must be stoppable) -->
    <section class="live" aria-label="Happening now">
      <span class="live__dot" aria-hidden="true"></span><span class="live__label">Now</span>
      <a class="live__win" id="live-win" href="#/time/attendance"><span class="live__msg"></span></a>
      <button type="button" class="live__go" id="live-pause" aria-label="Pause updates" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
    </section>

    <nav class="dock" aria-label="Quick actions">
      <button type="button" class="dock__btn" data-act="search" aria-label="Search (⌘K)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span class="dock__tip">Search <kbd>⌘K</kbd></span></button>
      <button type="button" class="dock__btn" data-act="new" aria-label="Create new" aria-haspopup="menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="dock__tip">Create <kbd>N</kbd></span></button>
      <button type="button" class="dock__btn" data-act="floor" aria-label="Who’s in today" aria-haspopup="dialog" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="dock__tip">Who’s in today</span></button>
      <button type="button" class="dock__btn" data-act="leave" aria-label="Request time off"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 10.5 7 21M4 9.5a8.5 8.5 0 0 1 16.6-1.4z"/><path d="M12.6 3.4c-2 1.3-3.3 3.4-3.8 5.7M3 21h18"/></svg><span class="dock__tip">Request time off</span></button>
      <button type="button" class="dock__btn" data-act="approve" aria-label="Approve all timesheets"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.2 2.4 2.4 4.6-4.8"/></svg><span class="dock__tip">Approve timesheets</span></button>
      <button type="button" class="dock__btn" data-act="export" aria-label="Export everyone as CSV"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11.5M7 10.5l5 5 5-5M5 14.5v3.5A2 2 0 0 0 7 20h10a2 2 0 0 0 2-2v-3.5"/></svg><span class="dock__tip">Export people</span></button>
      <button type="button" class="dock__btn dock__more" data-act="more" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg><span class="dock__tip">More</span></button>
      <span class="dock__sep" aria-hidden="true"></span>
      <a class="dock__btn" href="#/settings" data-route="settings" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l2 2.1 2.9-.4.7 2.8 2.6 1.4-1 2.8 1 2.8-2.6 1.4-.7 2.8-2.9-.4-2 2.1-2-2.1-2.9.4-.7-2.8-2.6-1.4 1-2.8-1-2.8 2.6-1.4.7-2.8 2.9.4Z"/></svg><span class="dock__tip">Settings</span></a>
      <a class="dock__btn dock__help" href="#/help" data-route="help" aria-label="Help"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2.1-2.4 3.6M12 17h.01"/></svg><span class="dock__tip">Help</span></a>
      <button type="button" class="dock__btn dock__theme" data-act="theme" aria-label="Switch to dark theme"><svg class="ico ico--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></svg><svg class="ico ico--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span class="dock__tip">Theme</span></button>
    </nav>

    <main id="main" class="main">
      <section class="view" data-view="overview" hidden></section>
      <section class="view" data-view="people" hidden></section>
      <section class="view" data-view="time" hidden></section>
      <section class="view" data-view="leave" hidden></section>
      <section class="view" data-view="payroll" hidden></section>
      <section class="view" data-view="hiring" hidden></section>
      <section class="view" data-view="performance" hidden></section>
      <section class="view" data-view="reports" hidden></section>
      <section class="view" data-view="settings" hidden></section>
      <section class="view" data-view="help" hidden></section>
    </main>
  </div>

  <section class="signin" id="signin" aria-labelledby="signin-t" hidden>
    <div class="signin__card">
      <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.2c2.6 2.4 4 5.3 4 8.8s-1.4 6.4-4 8.8c-2.6-2.4-4-5.3-4-8.8s1.4-6.4 4-8.8Z"/><path d="M12 3.6v16.8"/><path d="M8.6 9.2 12 11l3.4-1.8M8.4 13.8 12 15.6l3.6-1.8"/></svg></span>
      <h1 id="signin-t">Welcome back</h1>
      <p class="signin__sub">Sign in to Folka for Halloway Coffee Co.</p>
      <form class="signin__form" novalidate>
        <label class="field"><span class="field__label">Work email</span><input name="email" type="email" autocomplete="username" required /></label>
        <label class="field"><span class="field__label">Password</span><input name="password" type="password" autocomplete="current-password" required placeholder="Any password works in the demo" /></label>
        <p class="mform__err" role="alert"></p>
        <button type="submit" class="btn btn--primary">Sign in</button>
      </form>
    </div>
  </section>

  <div class="scrim" aria-hidden="true"></div>
  <div class="pop-layer"></div>

  <dialog class="finder" id="finder" aria-label="Search Folka">
    <div class="finder__bar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="finder-q" type="text" role="combobox" aria-expanded="true" aria-controls="finder-list" aria-autocomplete="list" placeholder="A name, a job title, a role, a page…" autocomplete="off" spellcheck="false" />
      <kbd>esc</kbd>
    </div>
    <ul class="finder__list" id="finder-list" role="listbox" aria-label="Results"></ul>
  </dialog>
  <dialog class="modal" id="modal"></dialog>
  <dialog class="drawer" id="drawer"></dialog>

  <div class="toast" role="status" aria-live="polite">
    <span class="toast__ico"></span><span class="toast__msg"></span>
    <button type="button" class="toast__undo" hidden>Undo</button>
  </div>
