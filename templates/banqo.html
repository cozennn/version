    /* Before first paint: the saved theme, the cards panel (open or slim) and
       the Appearance prefs (accent, tint, roundness, density, motion), so a
       reload never flashes the wrong look. Settings saves the derived CSS
       variables beside the prefs (css), so this applies them with no maths.
       Under ?record the page waits for the rig and ignores saved choices. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      var th = location.search.match(/[?&]theme=(dark|light)\b/);
      if (rec && th) d.dataset.theme = th[1];
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('banqo:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          if (localStorage.getItem('banqo:panel') === 'slim') d.classList.add('is-slim');
          var a = JSON.parse(localStorage.getItem('banqo:appearance') || 'null');
          if (a && a.v === 1 && a.css) {
            for (var k in a.css.vars) if (/^--[a-z0-9-]+$/.test(k)) d.style.setProperty(k, String(a.css.vars[k]));
            for (var n in a.css.attrs) if (/^data-(tint|density|motion)$/.test(n)) d.setAttribute(n, String(a.css.attrs[n]));
          }
        }
      } catch (e) {}
      if (!d.hasAttribute('data-tint')) d.setAttribute('data-tint', 'cool');
      if (d.dataset.theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1119');
    })(document.documentElement);
  </script>
