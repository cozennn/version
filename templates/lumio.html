    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      var th = location.search.match(/[?&]theme=(dark|light)\b/);
      var p = null;
      try { if (!rec) p = JSON.parse(localStorage.getItem('lumio:appearance') || 'null'); } catch (e) {}
      if (!p || p.v !== 1) p = { theme: 'dark' };
      var t = p.theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : (p.theme === 'light' ? 'light' : 'dark');
      if (rec && th) t = th[1];
      d.dataset.theme = t;
      if (/^#[0-9a-f]{6}$/i.test(p.accent || '')) d.style.setProperty('--accent', p.accent);

      if (p.tint) d.dataset.tint = p.tint;
      if (p.density) d.dataset.density = p.density;
      if (p.motion) d.dataset.motion = p.motion;
      if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e9e8e2');
    })(document.documentElement);
