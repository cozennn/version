		<div class="login-stage">
			<div class="login-wrap">
				<form class="login" action="#" method="post" novalidate autocomplete="on">
					<span class="login__sheen" aria-hidden="true"></span>

					<header class="login__head">
						<h1>Welcome back</h1>
						<p class="sub">Sign in to continue to Nocturne</p>
					</header>

					<div class="field">
						<input id="username" name="username" type="text" placeholder=" " autocomplete="username" required>
						<label for="username">Username</label>
					</div>

					<div class="field">
						<input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
						<label for="password">Password</label>
						<button type="button" class="reveal" aria-pressed="false" aria-label="Show password">
							<svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
							<svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.2 6.3A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
						</button>
					</div>

					<div class="row">
						<label class="check">
							<input type="checkbox" name="remember">
							<span class="check__box" aria-hidden="true"></span>
							Remember me
						</label>
						<a href="#" class="link">Forgot password?</a>
					</div>

					<button type="submit" class="btn">
						<span class="btn__label">Sign In</span>
						<span class="btn__spinner" aria-hidden="true"></span>
						<svg class="btn__check" viewBox="0 0 24 24" fill="none" stroke="#17102e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
					</button>
					<p class="status" role="status" aria-live="polite"></p>

					<div class="divider"><span>or continue with</span></div>

					<div class="socials">
						<button type="button" class="social">
							<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 3 29.3 1 24 1 11.8 1 2 10.8 2 23s9.8 22 22 22 22-9.8 22-22c0-1.5-.2-2.7-.4-4.5Z"/><path fill="#FF3D00" d="M4.3 14.7 11 19.6C12.7 15 18 11 24 11c3 0 5.8 1.1 7.9 3l5.7-5.7C34 3 29.3 1 24 1 15.5 1 8.1 5.8 4.3 14.7Z"/><path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.5-5.2l-6.2-5.3C29.2 35.9 26.7 37 24 37c-5.3 0-9.7-3.6-11.3-8.4l-6.6 5.1C9.8 40.1 16.4 45 24 45Z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4 5.5l6.2 5.3C41.2 34.4 46 30 46 23c0-1.5-.2-2.7-.4-4.5Z"/></svg>
