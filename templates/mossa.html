    /* Before first paint: the saved theme and the saved appearance, so a
       reload never flashes the wrong colours. Mirrors src/appearance.ts
       (same keys, no imports). Under ?record the page waits for the rig and
       ignores everything saved. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      var th = location.search.match(/[?&]theme=(dark|light)\b/);
      var theme = 'light', p = null;
      try { if (!rec) p = JSON.parse(localStorage.getItem('mossa:appearance') || 'null'); } catch (e) {}
      if (p && p.v === 1) {
        theme = p.theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : (p.theme === 'dark' ? 'dark' : 'light');
        if (p.vars && typeof p.vars === 'object') for (var k in p.vars) if (/^--[a-z0-9-]+$/.test(k) && typeof p.vars[k] === 'string') d.style.setProperty(k, p.vars[k]);
        if (p.surface === 'glass') d.dataset.surface = 'glass';
        if (p.density === 'compact') d.dataset.density = 'compact';
        if (p.motion === 'calm') d.dataset.motion = 'calm';
      }
      try { if (!rec && localStorage.getItem('mossa:rail') === '1') d.classList.add('rail-open'); } catch (e) {}
      if (rec && th) theme = th[1];
      d.dataset.theme = theme;
      if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141813');
    })(document.documentElement);
  </script>
