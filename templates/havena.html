    /* Before first paint: the saved theme and the saved appearance (accent,
       tint, roundness, density, focus ring, motion), so a reload never
       flashes the default palette. Under ?record the page waits for the
       rig and ignores saved choices. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      var th = location.search.match(/[?&]theme=(dark|light)\b/);
      if (rec && th) d.dataset.theme = th[1];
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('havena:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          var a = JSON.parse(localStorage.getItem('havena:appearance') || 'null');
          if (a && a.v === 1 && a.css) {
            var vars = a.css[d.dataset.theme === 'dark' ? 'dark' : 'light'] || {};
            for (var k in vars) if (/^--[a-z0-9-]+$/.test(k)) d.style.setProperty(k, String(vars[k]));
            if (a.motion === 'calm') d.dataset.motion = 'calm';
          }
        }
      } catch (e) {}
      if (d.dataset.theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c1713');
    })(document.documentElement);
  </script>
