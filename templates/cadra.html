<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="mesh" aria-hidden="true"><i class="mesh__a"></i><i class="mesh__b"></i><i class="mesh__c"></i></div>

  <div class="app">
    <header class="top">
      <a class="brand" href="#/dashboard" aria-label="Cadra — dashboard">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="7" cy="15.5" r="4"/><circle cx="17" cy="15.5" r="4"/><path d="m7 15.5 3.5-7h5l1.5 7M10.5 8.5 13 15.5h-6M9 6.5h3"/></svg></span>
        <span class="brand__text"><b>Cadra</b><small>Larkspur Cycles</small></span>
      </a>
      <!-- The ink pill is a clipped layer holding a cream copy of the tabs:
           its two edges move on their own, so it stretches without ever
           scaling, and the label colour changes exactly at its edge. -->
      <nav class="ttabs" id="ttabs" aria-label="Main"><div class="ttabs__track"></div></nav>
      <div class="top__tools">
        <button type="button" class="ibtn ibtn--glass" id="btn-bell" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="dot-badge" id="bell-badge" hidden></span></button>
        <button type="button" class="me" id="btn-me" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </header>

    <nav class="dock" aria-label="Quick actions">
      <button type="button" class="dock__btn" id="btn-find" data-ico="search" aria-label="Search (⌘K)"><span class="dock__tip">Search <kbd>⌘K</kbd></span></button>
      <button type="button" class="dock__btn" id="btn-new" data-ico="plus" aria-label="Create new" aria-haspopup="menu" aria-expanded="false"><span class="dock__tip">Create <kbd>C</kbd></span></button>
      <button type="button" class="dock__btn" id="btn-theme" aria-label="Switch to dark theme"><span class="dock__tip">Theme</span></button>
      <span class="dock__sep" aria-hidden="true"></span>
      <a class="dock__btn" href="#/support" data-route="support" data-ico="lifebuoy" aria-label="Support"><span class="dock__tip">Support</span></a>
      <a class="dock__btn" href="#/settings" data-route="settings" data-ico="gear" aria-label="Settings"><span class="dock__tip">Settings</span></a>
    </nav>

    <div class="phead">
      <div class="phead__lead">
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <h1 class="top__title" id="title" tabindex="-1">Dashboard</h1>
      </div>
      <!-- a grouped tab's pages, on glass, with a glass pill of its own -->
      <nav class="subnav" id="subnav" aria-label="Section" hidden><div class="subnav__track"></div></nav>
      <a class="shift" id="side-day" href="#/manufacturing/scheduling"></a>
    </div>

    <main id="main" class="main">
      <section class="view" data-view="dashboard" hidden></section>
      <section class="view" data-view="accounting" hidden></section>
      <section class="view" data-view="purchasing" hidden></section>
      <section class="view" data-view="sales" hidden></section>
      <section class="view" data-view="pos" hidden></section>
      <section class="view" data-view="inventory" hidden></section>
      <section class="view" data-view="manufacturing" hidden></section>
      <section class="view" data-view="logistics" hidden></section>
      <section class="view" data-view="hr" hidden></section>
      <section class="view" data-view="contacts" hidden></section>
      <section class="view" data-view="reporting" hidden></section>
      <section class="view" data-view="settings" hidden></section>
      <section class="view" data-view="support" hidden></section>
    </main>
  </div>

  <div class="scrim" aria-hidden="true"></div>
  <div class="pop-layer"></div>

  <dialog class="finder" id="finder" aria-label="Search Cadra">
    <div class="finder__bar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="finder-q" type="text" role="combobox" aria-expanded="true" aria-controls="finder-list" aria-autocomplete="list" placeholder="Work order, SKU, customer, invoice, person…" autocomplete="off" spellcheck="false" />
      <kbd>esc</kbd>
    </div>
    <ul class="finder__list" id="finder-list" role="listbox" aria-label="Results"></ul>
  </dialog>
  <dialog class="modal" id="modal"></dialog>
  <dialog class="drawer" id="drawer"></dialog>

  <div class="toast" role="status" aria-live="polite">
    <span class="toast__ico"></span><span class="toast__msg"></span>
    <button type="button" class="toast__undo" hidden>Undo</button>
  </div>
