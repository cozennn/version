<!--
  POSY — a birthday surprise

  A cat is holding a flower out. A stick figure is standing a few feet away
  with his back turned, wearing a party hat, and he has no idea. The whole
  page is one verb: GIVE IT TO HIM.

  The point of it is that the gift is a real object you have to carry, not a
  button that plays a cutscene. You pick the flower up and drag it across the
  floor, and everything else in the scene is downstream of where it is:

    · the cat's paw is GLUED to the stem — that arm is re-drawn from shoulder
      to stem every frame in scene coordinates, so as you pull, the cat leans
      after it. It holds on until the stem passes out of its reach, and only
      then does the paw open. So the moment of LETTING GO is something the cat
      does, at a distance you chose, rather than a keyframe at t=0.3s;

    · the stick figure turns round when the flower gets close enough to notice
      — and he turns by being scaled through zero on X, which is a real
      quarter-turn: the head squashes to a line and comes back the other way,
      and the face fades up on the far side of it;

    · his arm then reaches for the stem the same way the cat's did, capped at
      his own reach. Two arms, one stem, both solving for the same point:
      that is what makes it read as a HAND-OFF rather than two sprites
      overlapping.

  Drop it inside his reach and he takes it, the petals open, and the type
  arrives. Drop it anywhere else and it springs back to the cat, who was
  never going to keep it anyway.

  ONE COLOUR. Everything on the board is chalk-white line art on a plum-black
  floor — the cat, the man, the hat, the ground. The flower is the only
  saturated thing on the page, which is what makes it the thing to grab
  without a glow, a pulse, or a label pointing at it. When it is delivered the
  confetti is made of the flower: its coral, its gold, its green. Nothing else
  ever gets a colour.

  The typography is the opposite of the drawing on purpose. The actors are
  naive doodles; the words are a proper display serif with the soft and wonky
  axes wound up, set large and mixed-case, and they land letter by letter out
  of the burst. A cartoon can say happy birthday. It takes real type to MEAN
  it.

  The path through it without a mouse is the same path: the flower is a real
  button, Enter or Space sends it along an arc, and every reaction above runs
  off the position exactly as it does under a finger — the auto-give is not a
  second animation, it is the same one with a different driver. Reduced motion
  lands each state with none of the travel. With JavaScript off, the page is
  a card that already says happy birthday.

  Zero dependencies. Transform, opacity, and stroke geometry.
-->

<body>

<main class="stage" data-stage data-state="idle">

  <!-- Small, and it stays small. The page has one headline and it is not this
       one — this is just the label on the tin. -->
  <p class="kicker">A birthday surprise</p>

  <!--
    THE WORDS. Visible by default so the page is a birthday card with
    JavaScript off; hidden by `html.js` until the flower is delivered, at
    which point the letters arrive one at a time out of the burst.
  -->
  <p class="type" data-type>
    <span class="type__a" data-split>Happy</span>
    <span class="type__b" data-split>birthday</span>
    <span class="type__from">— from the cat</span>
  </p>

  <!-- The particles. Painted only after the hand-off, and made of the
       flower's own three colours so nothing new enters the palette. -->
  <canvas class="fizz" data-fizz aria-hidden="true"></canvas>

  <div class="board">
    <svg class="scene" data-scene viewBox="0 0 1200 782" preserveAspectRatio="xMidYMax meet" aria-hidden="true">

      <!-- ------------------------------------------------------- the floor -->
      <!-- One chalk line with a little sag in it. A dead-straight rule reads
           as a border; a sagging one reads as a drawing. -->
      <path class="ink ground" d="M64 641 C 340 636 700 647 1136 638" />
      <g class="dust">
        <circle cx="212" cy="600" r="2.4" /><circle cx="596" cy="566" r="2" />
        <circle cx="1004" cy="588" r="2.6" /><circle cx="716" cy="616" r="1.8" />
        <circle cx="388" cy="332" r="2.2" /><circle cx="930" cy="300" r="2" />
      </g>

      <!-- --------------------------------------------------------- the cat -->
      <g class="cat" data-cat>
        <g class="cat__hop">
          <path class="ink cat__tail" data-tail d="M304 640 C 252 650 214 620 222 582 C 228 554 258 546 270 566" />
          <path class="ink cat__body" d="M306 644 C 282 604 284 546 316 518 C 340 498 372 496 390 510 C 406 522 410 542 404 562 C 394 594 392 620 396 644 Z" />
          <path class="ink" d="M392 644 C 404 639 420 639 430 644" />
          <g class="cat__head" data-cathead transform="translate(398,472)">
            <path class="ink" d="M-30 -22 L-38 -60 L-6 -40 Z" />
            <path class="ink" d="M8 -42 L32 -66 L34 -28 Z" />
            <circle class="ink" cx="0" cy="0" r="38" />
            <!-- the eyes, and their happy replacements. Two sets, one fades
                 into the other; nothing is ever added to the DOM. -->
            <g class="cat__eyes" data-eyes transform="translate(0,0)">
              <circle class="ink dot" cx="-14" cy="-2" r="4.2" />
              <circle class="ink dot" cx="16" cy="-2" r="4.2" />
            </g>
            <g class="cat__glee">
              <path class="ink" d="M-21 -1 C -17 -10 -11 -10 -7 -1" />
              <path class="ink" d="M9 -1 C 13 -10 19 -10 23 -1" />
            </g>
            <path class="ink nose" d="M1 8 L11 8 L6 15 Z" />
            <path class="ink" d="M6 15 C 2 21 -5 21 -9 15" />
            <path class="ink" d="M6 15 C 10 21 17 21 21 15" />
            <g class="whisk">
              <path class="ink" d="M-14 6 L-38 2" /><path class="ink" d="M-14 11 L-38 14" />
              <path class="ink" d="M26 6 L50 2" /><path class="ink" d="M26 11 L50 14" />
            </g>
          </g>
        </g>
      </g>

      <!-- --------------------------------------------------- the birthday boy -->
      <!--
        The turn is one scaleX run from +1 through 0 to -1 about his own
        spine. Passing through zero is not a glitch to be avoided — it is the
        edge-on frame of a real quarter turn, and it is the only reason the
        head reads as a head rotating rather than a circle sliding.

        Every stroke in here carries non-scaling-stroke, because a squashed
        line whose width squashes with it goes thin and vanishes early.
      -->
      <g class="man" data-man>
        <g class="man__hop">
          <path class="ink" d="M880 342 L 851 378 H 909 Z" />
          <circle class="ink" cx="880" cy="336" r="7" />
          <circle class="ink" cx="880" cy="406" r="32" />
          <path class="ink man__tuft" data-tuft d="M855 383 C 845 375 843 389 851 395" />
          <g class="man__face" data-face>
            <circle class="ink dot" cx="884" cy="400" r="3.4" />
            <circle class="ink dot" cx="899" cy="401" r="3.4" />
            <path class="ink" d="M881 414 C 889 423 899 421 904 412" />
          </g>
          <path class="ink" d="M880 438 V 548" />
          <path class="ink man__far" data-far d="M880 468 C 899 492 907 514 903 532" />
          <path class="ink" d="M880 548 C 872 588 862 616 852 642" />
          <path class="ink" d="M880 548 C 892 588 902 616 912 642" />
          <path class="ink" d="M852 642 H 838" /><path class="ink" d="M912 642 H 926" />
        </g>
      </g>

      <!--
        THE TWO ARMS, and they live out here on purpose — in scene
        coordinates, outside both actors' own transforms. The man is mirrored
        when he turns; an arm inside that group would be mirrored with him and
        would reach away from the flower. Out here each arm just solves for
        the same stem, every frame, and neither actor's local space can lie
        about where the hand ended up.
      -->
      <g class="arms">
        <!-- the d/transform values below are the REST pose, written out so
             the drawing is complete before a line of JavaScript runs -->
        <path class="ink arm" data-catarm d="M390 552 Q455.3 534.6 499.3 483.4" />
        <path class="ink arm" data-manarm d="M880 468 Q883.6 505.4 857 532" />
        <circle class="ink dot paw" data-catpaw cx="0" cy="0" r="7" transform="translate(499.3 483.4)" />
        <circle class="ink dot paw" data-manpaw cx="0" cy="0" r="5.5" transform="translate(857 532)" />
      </g>

      <!-- The catch zone. Drawn only while something is in flight, and it is
           a dashed outline rather than a filled target because it is a hint,
           not a surface. -->
      <circle class="zone" data-zone cx="744" cy="452" r="104" />

      <!--
        THE FLOWER. The only colour on the page, and a real button: it takes
        focus, and Enter or Space sends it across on its own.
      -->
      <!-- It is only a BUTTON once there is something to press it for: the
           role and the tab stop are added by app.js, so with JavaScript off
           this is a picture of a flower and says so. -->
      <g class="posy" data-posy transform="translate(478 398) rotate(-14)">
        <path class="stem" d="M0 14 C 4 46 -3 74 0 96" />
        <path class="leaf" d="M0 56 C 19 47 32 56 27 71 C 15 82 1 75 0 60 Z" />
        <g class="petals" data-petals>
          <g class="petal" transform="rotate(0)"><ellipse cx="0" cy="-26" rx="11.5" ry="23" /></g>
          <g class="petal" transform="rotate(51.4)"><ellipse cx="0" cy="-26" rx="11.5" ry="23" /></g>
          <g class="petal" transform="rotate(102.8)"><ellipse cx="0" cy="-26" rx="11.5" ry="23" /></g>
          <g class="petal" transform="rotate(154.2)"><ellipse cx="0" cy="-26" rx="11.5" ry="23" /></g>
          <g class="petal" transform="rotate(205.7)"><ellipse cx="0" cy="-26" rx="11.5" ry="23" /></g>
          <g class="petal" transform="rotate(257.1)"><ellipse cx="0" cy="-26" rx="11.5" ry="23" /></g>
          <g class="petal" transform="rotate(308.5)"><ellipse cx="0" cy="-26" rx="11.5" ry="23" /></g>
        </g>
        <circle class="eye" cx="0" cy="0" r="12.5" />
      </g>

    </svg>
  </div>

  <!-- One line, and it is an instruction rather than a description. It leaves
       the moment you touch the flower and does not come back. -->
  <p class="hint" data-hint>Drag the flower to him</p>

  <button class="again" data-again type="button">Again</button>

  <p class="u-sr" role="status" data-live></p>
</main>

<div class="grain" aria-hidden="true"></div>
