          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;

      if (!rec) setTimeout(function () { d.classList.add('failsafe'); }, 4000);
    })(document.documentElement);
  </script>

<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="app">
    <header class="top">
      <a class="brand" href="#/dashboard" aria-label="Lumora — today">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.2c3.6 2.4 5.6 5.6 5.6 9.2A5.6 5.6 0 0 1 12 18a5.6 5.6 0 0 1-5.6-5.6c0-3.6 2-6.8 5.6-9.2Z"/><path d="M12 18v3M9 21h6M12 9.5v5.2M9.8 12.4 12 14.7l2.2-2.3"/></svg></span>
        <span class="brand__name">lumora</span>
      </a>
      <nav class="ptabs" aria-label="Main">
        <div class="ptabs__track">
          <a class="ptab" href="#/dashboard" data-tab="today">Today</a>
          <a class="ptab" href="#/timetable" data-tab="timetable">Timetable</a>
          <a class="ptab" href="#/classes" data-tab="classes">Classes<b class="ptab__dot" data-dot="classes" hidden></b></a>
          <a class="ptab" href="#/lessons" data-tab="teaching">Teaching<b class="ptab__dot" data-dot="teaching" hidden></b></a>
          <a class="ptab" href="#/results" data-tab="results">Results</a>
          <a class="ptab" href="#/messages" data-tab="messages">Messages<b class="ptab__count" data-count="messages"></b></a>
          <a class="ptab" href="#/library" data-tab="library">Library</a>
          <!-- The ink pill is a clipped layer holding a cream copy of the labels:
               its two edges move on their own, so it stretches without ever
               scaling, and the label colour changes exactly at its edge. -->
          <span class="ptabs__pill" aria-hidden="true"></span>
        </div>
      </nav>
      <div class="top__tools">
        <a class="bell-period" id="period" href="#/timetable/day"></a>
        <button type="button" class="ibtn ibtn--soft magnetic" id="btn-find" aria-label="Search (⌘K)" title="Search (⌘K)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
        <button type="button" class="ibtn ibtn--soft magnetic top__theme" id="btn-theme" aria-label="Switch to dark theme"></button>
        <button type="button" class="ibtn ibtn--soft magnetic" id="btn-bell" aria-label="Notifications" title="Notifications" aria-haspopup="dialog" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="num-badge" id="bell-badge" hidden></span></button>
        <button type="button" class="btn btn--primary top__new magnetic" id="btn-new" aria-label="Create new" aria-haspopup="menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
        <button type="button" class="me magnetic" id="btn-me" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </header>

    <!-- A grouped tab (Classes, Teaching, Results) opens this glass row of its pages. -->
    <nav class="subtabs" aria-label="Section" hidden>
      <div class="subtabs__track"><span class="subtabs__pill" aria-hidden="true"></span></div>
    </nav>

    <nav class="dock" aria-label="More">
      <a class="dock__btn" href="#/fees" data-route="fees"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17v3"/><rect x="4" y="8" width="16" height="12" rx="2.5"/><path d="M16 14h.01"/></svg><span class="dock__tip">Fees</span></a>
      <a class="dock__btn" href="#/leave" data-route="leave"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5c4-1 7-4 8-8M12 11.5c1-4.5 4-7 8-8-.5 4.5-3 7.5-8 8z"/><path d="M4 19.5h7"/></svg><b class="dock__count" data-count="leave"></b><span class="dock__tip">Leave</span></a>
      <a class="dock__btn dock__wren" href="#/wren" data-route="wren"><span class="dock__orb" aria-hidden="true"><i></i></span><span class="dock__tip">Ask Wren</span></a>
      <span class="dock__sep" aria-hidden="true"></span>
      <a class="dock__btn" href="#/settings" data-route="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l2 2.1 2.9-.4.7 2.8 2.6 1.4-1 2.8 1 2.8-2.6 1.4-.7 2.8-2.9-.4-2 2.1-2-2.1-2.9.4-.7-2.8-2.6-1.4 1-2.8-1-2.8 2.6-1.4.7-2.8 2.9.4Z"/></svg><span class="dock__tip">Settings</span></a>
    </nav>

    <main id="main" class="main">
      <section class="view" data-view="dashboard" hidden></section>
      <section class="view" data-view="classes" hidden></section>
      <section class="view" data-view="students" hidden></section>
      <section class="view" data-view="attendance" hidden></section>
      <section class="view" data-view="timetable" hidden></section>
      <section class="view" data-view="lessons" hidden></section>
      <section class="view" data-view="assignments" hidden></section>
      <section class="view" data-view="homework" hidden></section>
      <section class="view" data-view="quiz" hidden></section>
      <section class="view" data-view="results" hidden></section>
      <section class="view" data-view="messages" hidden></section>
      <section class="view" data-view="library" hidden></section>
      <section class="view" data-view="reports" hidden></section>
      <section class="view" data-view="leave" hidden></section>
      <section class="view" data-view="fees" hidden></section>
      <section class="view" data-view="settings" hidden></section>
      <section class="view" data-view="wren" hidden></section>
    </main>
  </div>

  <section class="signin" id="signin" aria-labelledby="signin-t" hidden>
    <div class="signin__card">
      <span class="brand__mark signin__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.2c3.6 2.4 5.6 5.6 5.6 9.2A5.6 5.6 0 0 1 12 18a5.6 5.6 0 0 1-5.6-5.6c0-3.6 2-6.8 5.6-9.2Z"/><path d="M12 18v3M9 21h6M12 9.5v5.2M9.8 12.4 12 14.7l2.2-2.3"/></svg></span>
      <h1 id="signin-t" class="signin__title">Welcome back</h1>
      <p class="signin__sub">Sign in to Lumora at Alder Hill International School.</p>
      <form class="signin__form" id="signin-form" novalidate>
        <label class="field"><span class="field__label">School email</span><input name="email" type="email" autocomplete="username" value="t.ferreira@alderhill.school" required /></label>
        <label class="field"><span class="field__label">Password</span><input name="password" type="password" autocomplete="current-password" value="demo-password" required /></label>
        <p class="mform__err" role="alert"></p>
        <button type="submit" class="btn btn--primary signin__go">Sign in</button>
        <p class="signin__hint">Demo account — the password is already filled in.</p>
      </form>
    </div>
  </section>

  <div class="scrim" aria-hidden="true"></div>
  <div class="pop-layer"></div>

  <dialog class="finder" id="finder" aria-label="Search Lumora">
    <div class="finder__bar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="finder-q" type="text" role="combobox" aria-expanded="true" aria-controls="finder-list" aria-autocomplete="list" placeholder="A student, a class, an assignment, a resource…" autocomplete="off" spellcheck="false" />
      <kbd>esc</kbd>
    </div>
    <ul class="finder__list" id="finder-list" role="listbox" aria-label="Results"></ul>
  </dialog>
  <dialog class="modal" id="modal"></dialog>
  <dialog class="drawer" id="drawer"></dialog>

  <div class="toast" role="status" aria-live="polite">
    <span class="toast__ico"></span><span class="toast__msg"></span>
    <button type="button" class="toast__undo" hidden>Undo</button>
  </div>
