    /* Before first paint: the saved theme and appearance (the derived colour
       tokens are cached by src/prefs.ts as carevo:vars), so a reload never
       flashes the default palette. Under ?record the page waits for the rig
       and ignores everything saved. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) {
        d.classList.add('is-record');
        var th = location.search.match(/[?&]theme=(dark|light)\b/);
        if (th) d.dataset.theme = th[1];
        return;
      }
      try {
        var c = JSON.parse(localStorage.getItem('carevo:vars') || 'null');
        var a = JSON.parse(localStorage.getItem('carevo:appearance') || 'null');
        var pref = a && a.theme ? a.theme : 'light';
        var t = pref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
        d.dataset.theme = t;
        if (c && c.vars && c.theme === t) for (var k in c.vars) d.style.setProperty(k, c.vars[k]);
        if (c) { d.dataset.surface = c.surface; d.dataset.density = c.density; d.dataset.motion = c.motion; }
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', (c && c.theme === 'dark' && c.vars['--bg']) || '#12130f');
      } catch (e) {}
    })(document.documentElement);
  </script>
